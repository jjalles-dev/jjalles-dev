name: Metrics

on:
  # Atualiza diariamente às 06h (horário de Brasília)
  schedule:
    - cron: "0 9 * * *"
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:
  # Roda também a cada push na main
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar métricas (inclui repositórios privados)
        uses: lowlighter/metrics@latest
        with:
          # SVG gerado e commitado no repositório
          filename: github-metrics.svg

          # Token com escopo `repo` — lido dos Secrets, NUNCA hardcoded
          token: ${{ secrets.METRICS_TOKEN }}
          user: jjalles-dev

          # Layout
          template: classic
          config_timezone: America/Sao_Paulo
          base: header, activity, community, repositories, metadata

          # Conta atividade em repos privados onde você é dono/colaborador
          repositories_affiliations: owner, collaborator, organization_member

          # Linguagens — AQUI entra o trabalho dos repos privados
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, tex, makefile, dockerfile
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # Mapa de atividade do ano
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
